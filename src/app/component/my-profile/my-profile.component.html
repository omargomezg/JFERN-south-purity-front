<div class="container">
  <div class="border mt-4 p-4">
    <app-paragraph-h1 text="Mis datos"></app-paragraph-h1>
    <div class="row">
      @if (!loading) {
        <div class="col-sm-8">
          {{user.role}}
          @if (user.role === 'ADMINISTRATOR') {
            <app-my-admin-profile [user]="user"></app-my-admin-profile>
          } @else {
            <app-my-customer-profile [user]="user"></app-my-customer-profile>
          }
        </div>
      }
      <div class="col-sm-4">
        <button type="button" mat-raised-button (click)="showModalPwd()">Cambia tu contraseña</button>
      </div>
    </div>
  </div>
</div>
