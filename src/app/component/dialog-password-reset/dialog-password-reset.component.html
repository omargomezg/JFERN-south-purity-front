<h2 mat-dialog-title>Restablecer contraseña</h2>
<mat-dialog-content class="mat-typography">
  <h3>Una vez finalizado el proceso, enviaremos un correo electrónico a {{ data.email }}</h3>
  <form novalidate [formGroup]="formPwd">
    <mat-form-field appearance="fill" class="base-full-width">
      <mat-label>Contraseña</mat-label>
      <input type="text" matInput formControlName="password" autocomplete="new-password">
      <button type="button" mat-icon-button matSuffix (click)="randomPassword()"
              title="Generar contraseña">
        <mat-icon>auto_fix_high</mat-icon>
      </button>
    </mat-form-field>
  </form>
</mat-dialog-content>
<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-button (click)="update()">Cambiar</button>
</mat-dialog-actions>
