<div class="container container-reset-pwd">
  <div class="row row-reset-pwd d-flex align-items-center">
    <div class="col-sm-6 mx-auto">
      <form (ngSubmit)="send()" [formGroup]="formPwdReset" novalidate autocomplete="off">
        <mat-card class="spec-card-height">
          <mat-card-header>
            <mat-card-title>Cambio de contraseña</mat-card-title>
          </mat-card-header>
          <mat-card-content class="card-content-flex">
            <p class="mb-8">Ingresa el código que recibiste en tu correo y define tu nueva contraseña.</p>

            <mat-form-field appearance="outline" class="base-full-width">
              <mat-label>Código</mat-label>
              <input matInput formControlName="code" type="text" placeholder="Código de verificación">
            </mat-form-field>

            <mat-form-field appearance="outline" class="base-full-width">
              <mat-label>Password</mat-label>
              <input matInput formControlName="password" type="password" autocomplete="new-password">
            </mat-form-field>

            <mat-form-field appearance="outline" class="base-full-width">
              <mat-label>Confirme password</mat-label>
              <input matInput formControlName="confirmPassword" type="password" autocomplete="new-password">
            </mat-form-field>
          </mat-card-content>

          <mat-card-actions align="end">
            <button mat-button type="button" (click)="cancel()">Cancelar</button>
            <button mat-flat-button color="primary" type="submit" [disabled]="!formPwdReset.valid">Restablecer contraseña</button>
          </mat-card-actions>
        </mat-card>
      </form>
    </div>
  </div>
</div>
