<h1 mat-dialog-title>Historial del proceso de compra</h1>
<div mat-dialog-content>
  <mat-list>
    @for (history of histories; track history; let i = $index) {
      <mat-list-item>{{history.date | date:'short'}} {{history.message}}</mat-list-item>
      @if (histories.length -1 !== i) {
        <mat-divider></mat-divider>
      }
    }
  </mat-list>
</div>
